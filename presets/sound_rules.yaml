sound_rules:
  one_shot:
    capsule_collision:
      event_type: CollisionEvent
      sample_name: clunck
      gain:
        fn: gain_from_impulse
        kwargs: {i0: 50, sigma_i: 25, max_factor_log: 0.75, base: 4.0}
      pitch:
        fn: pitch_from_relative_speed
        kwargs: {v0: 50, sigma_v: 40, max_factor_log: 0.75, base: 1.0}
    hit_wall:
      event_type: HitWallEvent
      sample_name: clunck
      gain:
        fn: gain_from_impulse
        kwargs: {i0: 50, sigma_i: 25, max_factor_log: 0.75, base: 4.0}
      pitch:
        fn: pitch_from_relative_speed
        kwargs: {v0: 50, sigma_v: 40, max_factor_log: 0.75, base: 1.0}
    hit_wall_special:
      event_type: HitWallEvent
      sample_name: gentle_ice_impact
      event_filter:
        wall_idx: [0,1]
      gain:
        fn: gain_from_impulse
        kwargs: {i0: 50, sigma_i: 25, max_factor_log: 0.75, base: 0.2}
      pitch:
        fn: pitch_from_relative_speed
        kwargs: {v0: 50, sigma_v: 40, max_factor_log: 0.75, base: 1.0}
  segment:
    hit_wall_segment:
      event_type: HitWallEvent
      sample_name: dr_pepper_audio_out
      overlay_name: dr_pepper_video.npz
      bpm: 92
      size_world: 13
      position_override: [0.0, 10.0]
      gate_mode: one_beat_after_last
      default_frame: 0
      event_filter:
        wall_idx: 0