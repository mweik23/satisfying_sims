outer_boundary:
  type: EllipseBoundary
  params:
    a: 50
    b: 50
    priority: 1.0
inner_walls:
  - type: CircularArcWall
    params:
      center: [0, 0]
      radius: 50
      angle_start: 5
      delta_angle: 1
      priority: 1.5
      color: red
      linewidth: 1.0
      animate:
        angle_start_velocity: 0.3